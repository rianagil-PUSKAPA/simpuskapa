name: SIM PUSKAPA Desktop installers

on:
  push:
    branches: [trunk, 'feature/desktop-*']
    paths:
      - 'desktop/**'
      - 'src/shared/app-links.cjs'
      - 'src/utils/desktop-launch.cjs'
      - 'src/utils/post-login-destination.ts'
      - 'src/components/NotificationLinkLauncher*'
      - 'src/pages/open.tsx'
      - 'src/middleware.ts'
      - 'src/pages/login.tsx'
      - 'src/pages/change-password.tsx'
      - 'src/server/commands/mail.transporter.ts'
      - 'deployment/apply-email-desktop-links.py'
      - 'src/pages/desktop/**'
      - 'src/pages/api/desktop/**'
      - 'src/components/DesktopDownloadAnnouncement*'
      - 'src/config/desktop-release.ts'
      - 'src/utils/desktop-announcement.ts'
      - 'src/pages/dashboard/index.tsx'
      - 'src/pages/welcome.tsx'
      - 'deployment/apply-desktop-release.py'
      - '.github/workflows/desktop-installers.yml'
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign/notarize with configured certificates (trunk only; bump the version first)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - id: release
        shell: bash
        run: node scripts/release-info.cjs >> "$GITHUB_OUTPUT"
      - name: Restrict signed builds to trunk
        if: inputs.signed && github.ref != 'refs/heads/trunk'
        run: exit 1

  installers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            command: dist:win
          - os: macos-latest
            platform: macOS-Intel-and-Apple-Silicon
            command: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    env:
      # Preview artifacts are intentionally unsigned/ad-hoc signed. No signing secrets run on branch pushes.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:smoke
      - name: Verify real update downloads and checksum rejection
        if: matrix.platform == 'Windows-x64'
        run: node --test test/updater.smoke.cjs
      - name: Check desktop download and email link pages
        if: matrix.platform == 'Windows-x64'
        run: node scripts/browser-ui-qa.cjs
      - name: Upload browser UI previews
        if: always() && matrix.platform == 'Windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: SIM-PUSKAPA-browser-popup-previews
          path: desktop/test-results/browser-popup/*.png
          if-no-files-found: ignore
      - name: Build preview installers
        if: ${{ !inputs.signed }}
        run: npm run ${{ matrix.command }}
      - name: Build signed installers
        if: inputs.signed && github.ref == 'refs/heads/trunk'
        run: npm run ${{ matrix.command }}
        env:
          SIM_DESKTOP_SIGNED: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Validate update manifests
        run: node scripts/verify-update-artifacts.cjs
      - name: Write installer checksums
        shell: bash
        run: node scripts/checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-PUSKAPA-Desktop-${{ needs.verify.outputs.version }}-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
            desktop/dist/beta*.yml
            desktop/dist/alpha*.yml
            desktop/dist/rc*.yml
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    if: github.ref == 'refs/heads/trunk'
    needs: [verify, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SIM-PUSKAPA-Desktop-${{ needs.verify.outputs.version }}-*
          path: desktop/dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - name: Generate combined installer checksums
        run: node desktop/scripts/checksums.cjs
      - name: Publish the preview download files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node desktop/scripts/publish-release.cjs
