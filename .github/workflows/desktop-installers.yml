name: SIM PUSKAPA Desktop installers

on:
  push:
    branches: [trunk, 'feature/desktop-*']
    paths:
      ['desktop/**', 'src/pages/desktop/**', 'src/pages/api/desktop/**', '.github/workflows/desktop-installers.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  installers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            command: dist:win
          - os: macos-latest
            platform: macOS-Intel-and-Apple-Silicon
            command: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    env:
      # Preview artifacts are intentionally unsigned/ad-hoc signed. No signing secrets run on branch pushes.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:smoke
      - run: npm run ${{ matrix.command }}
      - name: Write installer checksums
        shell: bash
        run: node scripts/checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: SIM-PUSKAPA-Desktop-0.1.0-preview-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/*.dmg
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
