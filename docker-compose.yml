version: '3.9'

services:
  db:
    image: docker.io/bitnami/mysql:8.0
    ports:
      - '3306:3306'
    networks:
      - puskapa
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=simpuskapa_dev
    healthcheck:
      test: ['CMD', '/opt/bitnami/scripts/mysql/healthcheck.sh']
      interval: 15s
      timeout: 5s
      retries: 6
    restart: always

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: simpuskapa
      MINIO_ROOT_PASSWORD: Strong#Pass#2023
    command: server --console-address ":9001" /data

networks:
  puskapa:

volumes:
  minio_storage: {}
